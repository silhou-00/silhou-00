name: Generate metric cards

on:
  schedule:
    - cron: "0 1 * * *" # daily at 09:00 PH time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github_dark
          UTC_OFFSET: 8
          NAME: Mathew Balanlay
          AUTO_PUSH: false

      - name: Restyle cards
        run: |
          sudo chown -R "$(id -u):$(id -g)" profile-summary-card-output
          python3 - <<'PY'
          import glob
          BODY = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          TITLE = "ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, monospace"
          OLD = """* {
                    font-family: 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif
                  }"""
          NEW = ("* { font-family: " + BODY + " }"
                 " text[style*='22px'] { font-family: " + TITLE
                 + "; letter-spacing: .04em; font-weight: 600 }")
          SUBS = [
              (OLD, NEW),
              ('stroke="#2e343b"', 'stroke="none"'),  # card border
              ("#0366d6", "#e6edf3"),                 # titles: blue -> near-white
              ("#8b949e", "#9198a1"),                 # labels and icons
              ("#40c463", "#39d353"),                 # charts -> snake green
              ("#77909c", "#6e7681"),                 # chart axes
          ]
          for f in glob.glob("profile-summary-card-output/github_dark/*.svg"):
              s = open(f, encoding="utf-8").read()
              for a, b in SUBS:
                  s = s.replace(a, b)
              open(f, "w", encoding="utf-8").write(s)
          PY

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git diff --staged --quiet || git commit -m "Update metric cards"
          git push
